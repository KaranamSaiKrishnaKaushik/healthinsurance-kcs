name: Deploy Azure Static Web App

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: azure-static-web-app-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOYMENT_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PROUD_DESERT_064308503 || secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Angular production site
        run: npm run build

      - name: Check static output
        run: npm run check

      - name: Require Azure deployment token
        shell: bash
        run: |
          if [ -z "$DEPLOYMENT_TOKEN" ]; then
            echo "::error::Missing Azure token. Add AZURE_STATIC_WEB_APPS_API_TOKEN_PROUD_DESERT_064308503 or AZURE_STATIC_WEB_APPS_API_TOKEN as a repository Actions secret."
            exit 1
          fi

      - name: Deploy static files
        id: deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PROUD_DESERT_064308503 || secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          production_branch: main
          app_location: dist/healthinsurance-kcs/browser
          api_location: ''
          output_location: ''
          skip_app_build: true
          skip_api_build: true

      - name: Record deployment URL
        env:
          SITE_URL: ${{ steps.deploy.outputs.static_web_app_url }}
        run: echo "Deployed website $SITE_URL" >> "$GITHUB_STEP_SUMMARY"
