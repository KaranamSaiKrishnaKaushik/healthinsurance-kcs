name: Deploy Azure Static Web App

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: azure-static-web-app-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOYMENT_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Angular production site
        run: npm run build

      - name: Check static output
        run: npm run check

      - name: Deploy static files
        if: env.DEPLOYMENT_TOKEN != ''
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: dist/healthinsurance-kcs/browser
          api_location: ''
          output_location: ''
          skip_app_build: true
          skip_api_build: true

      - name: Explain pending Azure setup
        if: env.DEPLOYMENT_TOKEN == ''
        run: echo 'Website files are ready. Add the AZURE_STATIC_WEB_APPS_API_TOKEN repository secret to enable Azure deployment.'
