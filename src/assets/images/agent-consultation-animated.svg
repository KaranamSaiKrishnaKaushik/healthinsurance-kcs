<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-labelledby="t d">
  <title id="t">Insurance advisor explaining a policy</title>
  <desc id="d">An animated illustration of a friendly insurance advisor explaining a health and life insurance policy to a customer across a desk.</desc>
  <defs>
    <clipPath id="card"><rect x="60" y="40" width="510" height="500" rx="28"/></clipPath>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4F0E7"/><stop offset="1" stop-color="#E9E3D6"/>
    </linearGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E2CDAE"/><stop offset="1" stop-color="#CDB28E"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1F3D33" flood-opacity=".18"/>
    </filter>
  </defs>
  <style>
    .frame{stroke-dasharray:900;stroke-dashoffset:900;animation:draw 1.6s .2s ease-out forwards}
    .float1{animation:bob 4s ease-in-out infinite}
    .float2{animation:bob 4.6s .8s ease-in-out infinite}
    .pop1{opacity:0;animation:pop .6s 1.2s cubic-bezier(.3,1.6,.5,1) forwards}
    .pop2{opacity:0;animation:pop .6s 1.8s cubic-bezier(.3,1.6,.5,1) forwards}
    .pop3{opacity:0;animation:pop .6s .8s cubic-bezier(.3,1.6,.5,1) forwards}
    .eyes{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
    .eyes2{transform-box:fill-box;transform-origin:center;animation:blink 6.5s 1.3s infinite}
    .line{stroke-dasharray:60;stroke-dashoffset:60;animation:write 6s infinite}
    .l2{animation-delay:.6s}.l3{animation-delay:1.2s}
    .msg{opacity:0;animation:cycle 9s infinite}
    .m2{animation-delay:3s}.m3{animation-delay:6s}
    .dot{animation:dots 1.2s infinite}.d2{animation-delay:.2s}.d3{animation-delay:.4s}
    @keyframes draw{to{stroke-dashoffset:0}}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
    @keyframes pop{0%{opacity:0;transform:scale(.6)}100%{opacity:1;transform:scale(1)}}
    @keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
    @keyframes write{0%{stroke-dashoffset:60}30%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:0;opacity:0}}
    @keyframes cycle{0%{opacity:0;transform:translateY(6px)}5%,30%{opacity:1;transform:translateY(0)}36%,100%{opacity:0;transform:translateY(-6px)}}
    @keyframes dots{0%,100%{opacity:.25}50%{opacity:1}}
    .pop1,.pop2,.pop3{transform-box:fill-box;transform-origin:center}
    @media (prefers-reduced-motion:reduce){
      *{animation:none!important}
      .frame{stroke-dashoffset:0}.pop1,.pop2,.pop3,.m1{opacity:1}.line{stroke-dashoffset:0}
    }
  </style>

  <!-- accent frame -->
  <path class="frame" d="M34 190 V566 H470" fill="none" stroke="#1F4D3F" stroke-width="8" stroke-linecap="square"/>

  <g clip-path="url(#card)">
    <!-- room -->
    <rect x="60" y="40" width="510" height="500" fill="url(#wall)"/>
    <g fill="#E4DCCB" stroke="#D5CBB6" stroke-width="2">
      <rect x="85" y="62" width="290" height="96" rx="8"/>
      <line x1="157" y1="62" x2="157" y2="158"/><line x1="230" y1="62" x2="230" y2="158"/><line x1="303" y1="62" x2="303" y2="158"/>
    </g>
    <g fill="#C9A86A"><rect x="146" y="98" width="5" height="22" rx="2"/><rect x="163" y="98" width="5" height="22" rx="2"/><rect x="292" y="98" width="5" height="22" rx="2"/><rect x="309" y="98" width="5" height="22" rx="2"/></g>

    <!-- clock -->
    <circle cx="482" cy="108" r="38" fill="#FFFFFF" stroke="#1F4D3F" stroke-width="5"/>
    <g stroke="#1F4D3F" stroke-linecap="round">
      <line x1="482" y1="108" x2="482" y2="86" stroke-width="4">
        <animateTransform attributeName="transform" type="rotate" from="0 482 108" to="360 482 108" dur="60s" repeatCount="indefinite"/>
      </line>
      <line x1="482" y1="108" x2="498" y2="108" stroke-width="4">
        <animateTransform attributeName="transform" type="rotate" from="0 482 108" to="360 482 108" dur="720s" repeatCount="indefinite"/>
      </line>
      <line x1="482" y1="108" x2="482" y2="80" stroke="#C9A86A" stroke-width="2">
        <animateTransform attributeName="transform" type="rotate" from="0 482 108" to="360 482 108" dur="6s" repeatCount="indefinite"/>
      </line>
    </g>
    <circle cx="482" cy="108" r="3.5" fill="#1F4D3F"/>

    <!-- background monitor -->
    <rect x="255" y="250" width="104" height="66" rx="5" fill="#2C3136"/>
    <rect x="300" y="316" width="14" height="22" fill="#3A4046"/>
    <rect x="240" y="338" width="150" height="10" rx="3" fill="#D8CDB9"/>

    <!-- customer (back view, left) -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 195 350; 1.5 195 350; 0 195 350; 0 195 350" keyTimes="0;.15;.3;1" dur="4s" repeatCount="indefinite"/>
      <path d="M60 560 C58 440 100 365 192 355 C272 360 304 420 314 476 L318 560 Z" fill="#2F3B4C"/>
      <path d="M150 362 C175 380 215 380 240 362" fill="none" stroke="#25303F" stroke-width="5"/>
      <rect x="176" y="318" width="36" height="44" rx="10" fill="#9A6A4B"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0 196 330; 3 196 330; 0 196 330; 3 196 330; 0 196 330; 0 196 330" keyTimes="0;.1;.2;.3;.4;1" dur="7s" repeatCount="indefinite"/>
        <ellipse cx="196" cy="282" rx="47" ry="54" fill="#9A6A4B"/>
        <path d="M150 284 C146 236 176 222 204 224 C236 226 248 248 244 270 C236 262 230 286 232 300 C214 318 172 320 150 284 Z" fill="#1E1916"/>
        <ellipse cx="240" cy="290" rx="9" ry="14" fill="#8C5E41"/>
      </g>
      <path d="M268 410 C292 420 304 430 312 446 L290 458 C278 446 262 438 250 436 Z" fill="#2F3B4C"/>
      <ellipse cx="300" cy="446" rx="16" ry="11" fill="#9A6A4B"/>
    </g>

    <!-- desk -->
    <rect x="60" y="430" width="510" height="26" fill="url(#desk)"/>
    <rect x="60" y="456" width="510" height="90" fill="#BFA27D"/>
    <line x1="60" y1="456" x2="570" y2="456" stroke="#A88B67" stroke-width="2"/>

    <!-- policy on desk -->
    <g transform="rotate(-6 320 438)">
      <rect x="292" y="424" width="62" height="16" rx="2" fill="#FFFFFF" stroke="#D9D2C3"/>
    </g>

    <!-- advisor (right) -->
    <g>
      <path d="M350 440 C346 350 378 306 442 300 C506 306 540 350 542 440 Z" fill="#F5D7DE"/>
      <g stroke="#EBC3CD" stroke-width="2" opacity=".7">
        <line x1="380" y1="340" x2="376" y2="440"/><line x1="410" y1="320" x2="408" y2="440"/><line x1="476" y1="320" x2="478" y2="440"/><line x1="506" y1="340" x2="510" y2="440"/>
      </g>
      <rect x="425" y="262" width="32" height="44" rx="10" fill="#C2865E"/>
      <path d="M418 300 L441 330 L464 300 L454 292 L441 312 L428 292 Z" fill="#FBE9ED" stroke="#E7BFC9"/>
      <!-- lanyard + badge -->
      <path d="M428 302 L446 392 L462 302" fill="none" stroke="#2A6FC9" stroke-width="5" stroke-linejoin="round"/>
      <rect x="432" y="392" width="30" height="38" rx="4" fill="#FFFFFF" stroke="#2A6FC9" stroke-width="3"/>
      <rect x="438" y="400" width="18" height="12" rx="2" fill="#DCE8F7"/>

      <!-- head -->
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0 441 280; -3 441 280; 0 441 280; -2 441 280; 0 441 280" dur="5s" repeatCount="indefinite"/>
        <ellipse cx="441" cy="226" rx="43" ry="51" fill="#C9906A"/>
        <ellipse cx="398" cy="232" rx="7" ry="12" fill="#B87F59"/>
        <path d="M398 222 C392 176 424 160 452 166 C484 170 494 196 486 220 C478 204 462 196 444 198 C426 200 410 206 406 226 Z" fill="#2A1E18"/>
        <path d="M404 238 C404 270 420 282 441 282 C462 282 480 270 482 236 C474 254 462 262 441 262 C422 262 410 254 404 238 Z" fill="#3A2A22"/>
        <g class="eyes"><ellipse cx="424" cy="224" rx="4" ry="5" fill="#2A1E18"/><ellipse cx="456" cy="224" rx="4" ry="5" fill="#2A1E18"/></g>
        <path d="M416 210 Q424 206 432 210 M448 210 Q456 206 464 210" fill="none" stroke="#2A1E18" stroke-width="3" stroke-linecap="round"/>
        <path d="M426 248 Q441 262 456 248 Z" fill="#FFFFFF" stroke="#7A3E2E" stroke-width="2" stroke-linejoin="round"/>
        <path d="M439 230 Q436 240 442 241" fill="none" stroke="#A86E4C" stroke-width="2" stroke-linecap="round"/>
      </g>

      <!-- explaining arm with document -->
      <path d="M370 330 C356 360 356 400 372 424 L396 420 C388 396 390 366 398 346 Z" fill="#F5D7DE"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0 380 420; -5 380 420; 0 380 420; -3 380 420; 0 380 420" dur="3.2s" repeatCount="indefinite"/>
        <path d="M372 424 C356 418 336 414 316 412 L318 432 C340 436 360 440 380 440 Z" fill="#F5D7DE"/>
        <g transform="rotate(-18 300 400)">
          <rect x="262" y="366" width="50" height="64" rx="3" fill="#FFFFFF" stroke="#D9D2C3" stroke-width="2"/>
          <rect x="270" y="374" width="20" height="5" rx="2" fill="#1F4D3F"/>
          <line class="line" x1="270" y1="388" x2="304" y2="388" stroke="#B9B1A1" stroke-width="3" stroke-linecap="round"/>
          <line class="line l2" x1="270" y1="398" x2="300" y2="398" stroke="#B9B1A1" stroke-width="3" stroke-linecap="round"/>
          <line class="line l3" x1="270" y1="408" x2="304" y2="408" stroke="#B9B1A1" stroke-width="3" stroke-linecap="round"/>
          <path d="M270 418 l4 4 l8 -8" fill="none" stroke="#2E8B57" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
        <ellipse cx="318" cy="422" rx="15" ry="12" fill="#C9906A"/>
        <line x1="306" y1="416" x2="268" y2="402" stroke="#9AA3AD" stroke-width="4" stroke-linecap="round"/>
      </g>
    </g>
  </g>

  <!-- speech bubble -->
  <g class="pop3">
    <g class="float1" filter="url(#shadow)">
      <path d="M248 150 h124 a16 16 0 0 1 16 16 v40 a16 16 0 0 1 -16 16 h-58 l-16 16 l-4 -16 h-46 a16 16 0 0 1 -16 -16 v-40 a16 16 0 0 1 16 -16 z" fill="#FFFFFF"/>
      <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" fill="#1F4D3F" text-anchor="middle">
        <g class="msg m1">
          <path d="M268 176 l12 -5 l12 5 v9 c0 9 -6 14 -12 17 c-6 -3 -12 -8 -12 -17 z" fill="#1F4D3F"/>
          <path d="M280 190 c-3 -3 -6 -5 -6 -8 a3 3 0 0 1 6 -1 a3 3 0 0 1 6 1 c0 3 -3 5 -6 8z" fill="#FFFFFF"/>
          <text x="338" y="192">Health cover</text>
        </g>
        <g class="msg m2">
          <path d="M268 186 a12 12 0 0 1 24 0 z" fill="#1F4D3F"/><path d="M280 186 v12 a3 3 0 0 1 -6 0" fill="none" stroke="#1F4D3F" stroke-width="2.5" stroke-linecap="round"/>
          <text x="340" y="192">Life cover</text>
        </g>
        <g class="msg m3">
          <circle cx="280" cy="186" r="12" fill="#2E8B57"/><path d="M274 186 l4 4 l8 -8" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          <text x="340" y="192">Peace of mind</text>
        </g>
      </g>
    </g>
  </g>

  <!-- floating badges -->
  <g class="pop1">
    <g class="float2" filter="url(#shadow)">
      <rect x="84" y="186" width="150" height="44" rx="22" fill="#FFFFFF"/>
      <circle cx="108" cy="208" r="13" fill="#E3EFE9"/>
      <path d="M102 208 l4 4 l8 -8" fill="none" stroke="#1F4D3F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="128" y="213" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="600" fill="#1F4D3F">Family covered</text>
    </g>
  </g>
  <g class="pop2">
    <g class="float1" filter="url(#shadow)">
      <rect x="404" y="476" width="150" height="44" rx="22" fill="#1F4D3F"/>
      <circle cx="428" cy="498" r="5" fill="#C9A86A" class="dot"/>
      <circle cx="444" cy="498" r="5" fill="#C9A86A" class="dot d2"/>
      <circle cx="460" cy="498" r="5" fill="#C9A86A" class="dot d3"/>
      <text x="474" y="503" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">Advising</text>
    </g>
  </g>
</svg>
